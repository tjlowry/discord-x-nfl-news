name: poll

on:
  schedule:
    # 3x/day: 8am, 1pm, 6pm Central Daylight Time (13:07, 18:07, 23:07 UTC).
    # Cron is UTC, so under Central Standard Time (Nov–Mar) these land an hour
    # earlier: 7am, noon, 5pm. Off the top of the hour, where GitHub delays runs most.
    - cron: "7 13,18,23 * * *"
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run bot
        run: python bot.py
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}

      - name: Commit seen.json
        run: |
          if git diff --quiet -- seen.json; then
            echo "seen.json unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          git commit -m "chore: update seen [skip ci]"
          git pull --rebase
          git push
