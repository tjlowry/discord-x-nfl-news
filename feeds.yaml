# Two kinds of entries:
#   handle: <account>   a feed for one X account; posts as that account
#   name:   <label>     a multi-account feed (e.g. an X List); posts as each tweet's author
# Options (both default false): skip_replies, skip_retweets
#
# Don't give an account its own feed if it's also in a list feed: retweets carry
# different status IDs in each and would be posted twice.
feeds:
  - name: cards-list
    url: https://rss.app/feeds/387txf5LodANzguJ.xml
    skip_replies: true
